[package]
name = "pqpg"
version = "0.1.0"
edition = "2021"
authors = ["Gab Virebent <gabriel1@virebent.art>"]
description = "Post-Quantum Privacy Guard: lightweight CLI for hybrid post-quantum file encryption, signing and key management"
license = "AGPL-3.0-only"

[dependencies]
# Post-Quantum & Hybrid Cryptography
ml-kem = "0.2"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"

# Memory & Hygiene
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.8"
libc = "0.2"

# CLI & Formatting
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
thiserror = "2.0"
anyhow = "1.0"
qrcode = { version = "0.14", default-features = false }
